<ul class="nav">
  {% for name, link, fa in MENU %}
    <li class="nav-item">
      <a class="nav-link" href="{{ link }}">
        <em class="fa-solid fa-{{ fa }}"></em> {{ name }}
      </a>
    </li>
  {% endfor %}
  {% if DISPLAY_PAGES_ON_MENU %}
    <li class="nav-item">
      <a class="nav-link" href="{{ SITEURL }}/pages.html">
        <em class="fa-solid fa-newspaper"></em> Pages
      </a>
    </li>
  {% endif %}
</ul>
